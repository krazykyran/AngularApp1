<h1>{{ title() }}</h1>
<p>Recipe:{{ recipe().name }}</p>
<p>Description:{{ recipe().description }}</p>
<p>Servings:{{ servings() }}</p>
<button (click)="increaseServings()">+</button><button (click)="decreaseServings()">-</button>
<button (click)="selectSpaghettiCarbonara()">Spaghetti Carbonara</button>
<button (click)="selectCapreseSalad()">Caprese Salad</button>
